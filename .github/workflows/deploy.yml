name: Bouw en publiceer Topschilder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Site genereren
        run: python build.py

      - name: Controleren op fouten
        run: |
          python verify.py | tee controle.log
          if grep -q 'ALLES OK' controle.log; then
            echo 'Controle geslaagd.'
          else
            echo '::error::De controle vond problemen - publicatie gestopt.'
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
