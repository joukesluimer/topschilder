<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · offertechecker</title>
<style>html,body{margin:0;background:#1b1b1b}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Offertechecker: een papieren offerte op een eikenhouten tafel, schuin van boven.
// Alleen onleesbare grijze tekstregels en een tabel; een markeerstift heeft één
// regel oranje gemarkeerd en een vergrootglas licht die regel uit. Ernaast een pen
// en een kleurwaaier.
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { W, H, Layer, fbm, noise, hash2, clamp, mix, smooth, hex, mix3,
  makeRenderer, makeComposer, addSun, outdoorEnv, saveAll } from './b-common.js';

const renderer = makeRenderer({ exposure: 1.0 });
const scene = new THREE.Scene();
const { env } = outdoorEnv(renderer, { sunAz: -0.9, sunEl: 0.7, ground: '#6e5a45', tint: [1.0, 0.9, 0.76], brightness: 0.85 });
scene.environment = env;
scene.background = new THREE.Color('#3a2e24');

// ------------------------------------------------ eikenhouten tafelblad
{
  const TW = 1.3, TD = 0.95;
  const L = new Layer(2048, 1496);
  L.fill((u, v, i) => {
    const X = u * TW, Y = v * TD;
    const PWD = 0.16;
    const plank = Math.floor(Y / PWD), ly = Y - plank * PWD;
    const ps = plank * 31.7;
    // jaarringen van een plat gezaagde plank: afstand tot de stamas die onder het
    // oppervlak ligt en langs de plank van diepte verandert -> vlammen/bogen
    const center = 0.05 * (fbm(X * 0.6 + ps, plank * 1.7, plank + 3, 3) - 0.5);
    const depth = Math.max(0.002, 0.06 * (fbm(X * 2.2 + ps * 2, plank * 0.3, plank + 4, 3) - 0.3));
    const rr = Math.hypot(ly - PWD / 2 - center, depth) + 0.0015 * fbm(X * 8, ly * 40, plank + 6, 3);
    const ring = Math.pow(0.5 + 0.5 * Math.sin(rr * 2 * Math.PI / 0.0042), 3) * (0.45 + 0.9 * noise(rr * 260, plank, plank + 8));
    const broad = fbm(X * 1.5 + ps, ly * 25, plank + 5, 3);
    const fine = fbm(X * 4, Y * 900, plank + 7, 3);
    const flake = smooth(0.74, 0.9, fbm(X * 30 + ps, ly * 90, plank + 9, 3)); // eiken spiegels
    let c = mix3(hex('#c9a072'), hex('#a77a4e'), broad * 0.7);
    c = mix3(c, hex('#8a6038'), ring * 0.3 + smooth(0.55, 0.8, fine) * 0.12);
    c = mix3(c, hex('#d9b68a'), flake * 0.25);
    c = c.map(x => x * (0.92 + 0.1 * hash2(plank, 1, 5)));
    let hgt = -ring * 0.25 - fine * 0.25;
    const gap = Math.min(ly, PWD - ly);
    if (gap < 0.0018) { c = c.map(x => x * 0.35); hgt = -2; }
    L.set(i, c, hgt, 0.5 + 0.15 * fine + (gap < 0.0018 ? 0.4 : 0));
  });
  const t = L.toTextures(2.5);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(TW, TD), new THREE.MeshPhysicalMaterial({ ...t, clearcoat: 0.25, clearcoatRoughness: 0.35 }));
  m.rotation.x = -Math.PI / 2; m.rotation.z = 0.06; m.receiveShadow = true; scene.add(m);
}

// ------------------------------------------------ offerte (canvas)
const PW = 0.21, PH = 0.297;
function drawQuote(seed, { highlightRow = -1, page2 = false } = {}) {
  const cw = 1654, ch = 2339; // ~200 dpi
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d');
  // papier met vezels
  const img = g.createImageData(cw, ch);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const n = noise(x * 0.35, y * 0.35, seed) * 0.5 + noise(x * 0.06, y * 0.06, seed + 1) * 0.5;
    const v = 246 + (n - 0.5) * 7;
    const k = (y * cw + x) * 4; img.data[k] = v; img.data[k + 1] = v - 1.5; img.data[k + 2] = v - 5; img.data[k + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  let s = seed * 9301 + 49297;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const ink = (a = 1) => `rgba(78,80,84,${a})`;
  const bar = (x, y, w, h, a = 0.85) => { g.fillStyle = ink(a); g.beginPath(); g.roundRect(x, y, w, h, h / 2.5); g.fill(); };
  // een regel "tekst": woordblokjes met spaties, links of rechts uitgelijnd
  const words = (x, y, maxW, h = 15, a = 0.8, right = false) => {
    const ws = []; let tot = 0;
    while (tot < maxW) { const w = 22 + rnd() * 95; if (tot + w > maxW) break; ws.push(w); tot += w + h * 0.9; }
    let cx = right ? x - (tot - h * 0.9) : x;
    for (const w of ws) { bar(cx, y, w, h, a * (0.85 + rnd() * 0.15)); cx += w + h * 0.9; }
  };
  const M = 150;
  if (!page2) {
    // kop: naamblok (geen logo), adresregels rechts
    bar(M, 150, 330, 46, 0.9);
    words(M, 215, 240, 16, 0.55);
    for (let k = 0; k < 4; k++) words(cw - M, 150 + k * 34, 200 + rnd() * 110, 15, 0.6, true);
    // klantblok
    for (let k = 0; k < 3; k++) words(M, 400 + k * 34, 180 + rnd() * 160, 15, 0.75);
    // titel en kenmerk
    bar(M, 590, 360, 34, 0.9);
    for (let k = 0; k < 3; k++) { bar(M, 660 + k * 34, 120, 14, 0.5); words(M + 190, 660 + k * 34, 120 + rnd() * 120, 14, 0.75); }
    // inleiding
    for (let k = 0; k < 3; k++) words(M, 810 + k * 32, k === 2 ? 700 : cw - 2 * M, 14, 0.7);
    // tabel
    const cols = [M, 860, 1000, 1180, cw - M];
    const ty = 960, rh = 66;
    g.fillStyle = 'rgba(70,74,80,0.14)'; g.fillRect(M - 14, ty, cw - 2 * M + 28, 58);
    bar(M, ty + 21, 170, 16, 0.85); bar(cols[1], ty + 21, 70, 16, 0.85); bar(cols[2], ty + 21, 90, 16, 0.85);
    bar(cols[4] - 110, ty + 21, 110, 16, 0.85); bar(cols[3], ty + 21, 80, 16, 0.85);
    const rows = 11;
    for (let r = 0; r < rows; r++) {
      const y = ty + 58 + r * rh;
      if (r === highlightRow) {
        // markeerstift: een paar overlappende, iets scheve halen
        g.save(); g.globalCompositeOperation = 'multiply';
        for (let k = 0; k < 3; k++) {
          g.fillStyle = 'rgba(244,130,11,0.30)';
          g.beginPath();
          const j = (rnd() - 0.5) * 6;
          g.moveTo(M - 18, y + 12 + j); g.lineTo(cw - M + 14, y + 9 + j);
          g.lineTo(cw - M + 18, y + rh - 10 + j); g.lineTo(M - 14, y + rh - 8 + j); g.closePath(); g.fill();
        }
        g.restore();
      }
      words(M, y + 18, 260 + rnd() * 380, 15, 0.8);
      if (rnd() > 0.55) words(M, y + 42, 160 + rnd() * 260, 11, 0.45);
      bar(cols[2] - 40 - rnd() * 30, y + 18, 30 + rnd() * 30, 15, 0.8);
      bar(cols[2] + 20, y + 18, 46, 15, 0.6);
      words(cols[3] + 150, y + 18, 70 + rnd() * 50, 15, 0.8, true);
      words(cols[4], y + 18, 80 + rnd() * 45, 15, 0.85, true);
      g.fillStyle = 'rgba(70,74,80,0.18)'; g.fillRect(M - 14, y + rh - 2, cw - 2 * M + 28, 2);
    }
    // totalen
    const by = ty + 58 + rows * rh + 40;
    for (let k = 0; k < 3; k++) { bar(1090, by + k * 40, 150, 15, 0.6); words(cw - M, by + k * 40, 100 + rnd() * 30, 15, 0.8, true); }
    g.fillStyle = 'rgba(70,74,80,0.6)'; g.fillRect(1080, by + 128, cw - M - 1080, 3);
    bar(1090, by + 150, 170, 22, 0.95); bar(cw - M - 150, by + 150, 150, 22, 0.95);
    // voorwaarden en ondertekening
    for (let k = 0; k < 4; k++) words(M, by + 260 + k * 30, k === 3 ? 600 : cw - 2 * M, 12, 0.55);
    g.fillStyle = 'rgba(70,74,80,0.5)'; g.fillRect(M, ch - 300, 420, 2); g.fillRect(cw - M - 420, ch - 300, 420, 2);
    bar(M, ch - 280, 160, 12, 0.5); bar(cw - M - 420, ch - 280, 160, 12, 0.5);
    for (let k = 0; k < 2; k++) words(cw / 2 + 300, ch - 150 + k * 26, 600, 10, 0.4, true);
  } else {
    for (let k = 0; k < 30; k++) words(M, 160 + k * 44, k % 7 === 6 ? 500 : cw - 2 * M, 14, 0.65);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16;
  return t;
}
function paperGeo(curl) {
  const g = new THREE.PlaneGeometry(PW, PH, 60, 84);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    // rechteronderhoek iets opgekruld, licht golvend papier
    const dc = Math.hypot(x - PW / 2, y + PH / 2);
    const lift = curl * Math.pow(Math.max(0, 0.09 - dc) / 0.09, 2) + 0.0006 * Math.sin(y * 30 + x * 10) * (0.5 + x / PW);
    p.setZ(i, lift);
  }
  g.computeVertexNormals();
  g.rotateX(-Math.PI / 2);
  return g;
}
const paperMat = (map) => new THREE.MeshStandardMaterial({ map, roughness: 0.9, side: THREE.DoubleSide });
const HROW = 5;
const quoteTex = drawQuote(3, { highlightRow: HROW });
{
  const under = new THREE.Mesh(paperGeo(0.0), paperMat(drawQuote(7, { page2: true })));
  under.position.set(0.035, 0.0006, -0.02); under.rotation.y = -0.16; under.receiveShadow = under.castShadow = true; scene.add(under);
  const q = new THREE.Mesh(paperGeo(0.012), paperMat(quoteTex));
  q.position.set(0, 0.0012, 0); q.rotation.y = 0.05; q.receiveShadow = q.castShadow = true; scene.add(q);
  window.quote = q;
}

// ------------------------------------------------ vergrootglas boven de gemarkeerde regel
{
  // positie van de gemarkeerde regel in papier-uv (canvas 1654 x 2339)
  const rowY = 960 + 58 + HROW * 66 + 33;
  const cu = 1250 / 1654, cv = 1 - rowY / 2339;
  const R = 0.034, LH = 0.03, Z = 1.75;
  // lokale positie op het (gedraaide) papier
  const local = new THREE.Vector3((cu - 0.5) * PW, 0, -(cv - 0.5) * PH).applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.05);
  const grp = new THREE.Group();
  const zoomTex = quoteTex.clone();
  const ru = R / PW, rv = R / PH;
  zoomTex.repeat.set((2 * ru) / Z, (2 * rv) / Z);
  zoomTex.offset.set(cu - ru / Z, cv - rv / Z);
  zoomTex.needsUpdate = true;
  const disc = new THREE.Mesh(new THREE.CircleGeometry(R, 96), new THREE.MeshStandardMaterial({ map: zoomTex, roughness: 0.9 }));
  disc.rotation.x = -Math.PI / 2; disc.rotation.z = 0.05; disc.position.y = 0.002; grp.add(disc);
  // lens: bolle glasschijf
  const lensGeo = new THREE.SphereGeometry(R * 3.2, 96, 24, 0, Math.PI * 2, 0, Math.asin(R / (R * 3.2)));
  const glass = new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.0, transparent: true, opacity: 0.12, envMapIntensity: 2.2, clearcoat: 1, clearcoatRoughness: 0 });
  const lens = new THREE.Mesh(lensGeo, glass);
  lens.position.y = LH - R * 3.2 * Math.cos(Math.asin(1 / 3.2)) ; grp.add(lens);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(R + 0.002, 0.0035, 24, 128),
    new THREE.MeshStandardMaterial({ color: '#2b2b2d', metalness: 0.6, roughness: 0.35 }));
  rim.rotation.x = Math.PI / 2; rim.position.y = LH; rim.castShadow = true; grp.add(rim);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.02, 16), rim.material);
  neck.rotation.z = Math.PI / 2; neck.position.set(R + 0.012, LH, 0); neck.castShadow = true; grp.add(neck);
  const handle = new THREE.Mesh(new THREE.CapsuleGeometry(0.0085, 0.085, 8, 24),
    new THREE.MeshPhysicalMaterial({ color: '#3b2a1e', roughness: 0.35, clearcoat: 0.6 }));
  handle.rotation.z = Math.PI / 2 - 0.25; handle.position.set(R + 0.07, LH - 0.012, 0); handle.castShadow = true; grp.add(handle);
  // het "beeld" in de lens hoort bij het glas, niet op tafelhoogte
  disc.position.y = LH - 0.0005;
  // iets naar de camera toe: door het midden van de lens zie je dan precies de gemarkeerde regel
  grp.position.set(local.x + 0.0015, 0, local.z + 0.026);
  grp.rotation.y = -0.45;
  disc.rotation.z = 0.05 + 0.45; // beeld blijft uitgelijnd met het papier
  scene.add(grp);
}

// ------------------------------------------------ markeerstift en pen
{
  const body = new THREE.MeshPhysicalMaterial({ color: '#e9e7e2', roughness: 0.4, clearcoat: 0.3 });
  const accent = new THREE.MeshPhysicalMaterial({ color: '#f4820b', roughness: 0.35, clearcoat: 0.4 });
  const mk = new THREE.Group();
  const b = new THREE.Mesh(new RoundedBoxGeometry(0.11, 0.016, 0.022, 4, 0.006), body); b.castShadow = b.receiveShadow = true; mk.add(b);
  const cap = new THREE.Mesh(new RoundedBoxGeometry(0.045, 0.018, 0.024, 4, 0.007), accent); cap.position.x = 0.072; cap.castShadow = true; mk.add(cap);
  const clip = new THREE.Mesh(new RoundedBoxGeometry(0.03, 0.004, 0.006, 2, 0.002), accent); clip.position.set(0.07, 0.01, 0); mk.add(clip);
  mk.scale.setScalar(0.85); mk.position.set(0.15, 0.0078, 0.095); mk.rotation.y = 0.9; scene.add(mk);

  const pen = new THREE.Group();
  const penMat = new THREE.MeshPhysicalMaterial({ color: '#1f2a3a', roughness: 0.25, metalness: 0.3, clearcoat: 1, clearcoatRoughness: 0.1 });
  const chrome = new THREE.MeshStandardMaterial({ color: '#d8dade', metalness: 1, roughness: 0.15 });
  const pb = new THREE.Mesh(new THREE.CylinderGeometry(0.0052, 0.0052, 0.12, 32), penMat); pb.castShadow = true; pen.add(pb);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.0052, 0.018, 32), chrome); tip.position.y = -0.069; tip.rotation.x = Math.PI; tip.castShadow = true; pen.add(tip);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.0054, 0.0054, 0.012, 32), chrome); top.position.y = 0.062; pen.add(top);
  const pclip = new THREE.Mesh(new RoundedBoxGeometry(0.003, 0.045, 0.0025, 2, 0.001), chrome); pclip.position.set(0, 0.04, 0.0065); pclip.castShadow = true; pen.add(pclip);
  pen.rotation.set(Math.PI / 2, 0, 0); // langs z
  const penHolder = new THREE.Group(); penHolder.add(pen);
  penHolder.rotation.y = 0.55 + Math.PI / 2; penHolder.position.set(-0.155, 0.0055, 0.06);
  scene.add(penHolder);
}

// ------------------------------------------------ kleurwaaier
{
  const fan = new THREE.Group();
  const hues = [
    ['#e9e2cf', '#d9ceb2', '#c6b791', '#ad9a6e', '#8f7b52', '#6c5b3c'],   // zand/oker
    ['#dfe6dc', '#c3d0bf', '#a1b39b', '#7e9478', '#5d7458', '#3f5240'],   // salie/groen
    ['#e3e8ee', '#c4d0dc', '#9fb1c4', '#7890a8', '#55708c', '#3b5068'],   // grijsblauw
    ['#f1dfd5', '#e5c2b0', '#d39d85', '#bb775c', '#9b5640', '#743c2d'],   // terracotta
    ['#e7e5e1', '#cfccc6', '#b2aea6', '#938f86', '#726f68', '#53514c'],   // warm grijs
    ['#f2e6c4', '#ecd59a', '#e2bf6b', '#d2a541', '#b5872b', '#8c6820'],   // geel
    ['#e1e9e4', '#bdd1c6', '#93b3a2', '#6a917d', '#46705b', '#2f4b3c'],   // dennengroen
    ['#efe0e0', '#dfc2c2', '#c99f9f', '#ad7b7b', '#8d5c5c', '#6a4343'],   // oudroze
  ];
  const SW = 0.042, SL = 0.19;
  hues.forEach((cols, k) => {
    const c = document.createElement('canvas'); c.width = 128; c.height = 580;
    const g = c.getContext('2d');
    g.fillStyle = '#f4f2ed'; g.fillRect(0, 0, 128, 580);
    const ph = 76;
    cols.forEach((col, j) => { g.fillStyle = col; g.fillRect(8, 8 + j * (ph + 4), 112, ph); });
    // onleesbare codeblokjes onderaan
    g.fillStyle = 'rgba(80,80,80,0.5)'; g.fillRect(12, 8 + 6 * (ph + 4) + 18, 56, 10); g.fillRect(12, 8 + 6 * (ph + 4) + 36, 36, 8);
    g.beginPath(); g.arc(100, 545, 9, 0, Math.PI * 2); g.fillStyle = '#d8d4cc'; g.fill();
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16;
    const geo = new RoundedBoxGeometry(SW, 0.0012, SL, 2, 0.0005);
    // strookje karton met de kleurvlakken als eigen bovenvlak
    const strip = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: '#efede8', roughness: 0.7 }));
    const face = new THREE.Mesh(new THREE.PlaneGeometry(SW - 0.0015, SL - 0.0015), new THREE.MeshStandardMaterial({ map: t, roughness: 0.55 }));
    face.rotation.x = -Math.PI / 2; face.rotation.z = Math.PI; face.position.y = 0.00061;
    strip.add(face);
    strip.castShadow = strip.receiveShadow = true; face.receiveShadow = true;
    const holder = new THREE.Group();
    strip.position.set(0, 0, -SL / 2 + 0.012);   // draaipunt aan het uiteinde
    holder.add(strip);
    holder.rotation.y = -0.15 - k * 0.13;
    holder.position.y = 0.0007 + k * 0.00125;
    fan.add(holder);
  });
  const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, 0.014, 24),
    new THREE.MeshStandardMaterial({ color: '#c7c9cc', metalness: 1, roughness: 0.3 }));
  bolt.position.y = 0.006; bolt.castShadow = true; fan.add(bolt);
  fan.position.set(-0.2, 0, -0.075);
  fan.rotation.y = 0.35;
  scene.add(fan);
}

// ------------------------------------------------ licht en camera
scene.add(new THREE.HemisphereLight('#fff3e2', '#6b513a', 0.22));
addSun(scene, { pos: [-1.2, 1.7, -0.9], target: [0, 0, 0], intensity: 4.2, size: 0.4, near: 0.5, far: 5, color: '#ffdcb0' });
// zacht invullicht van rechts (raam aan de overkant)
const fill = new THREE.DirectionalLight('#f1ebe2', 0.3); fill.position.set(1, 1.2, 1); scene.add(fill);

const camera = new THREE.PerspectiveCamera(30, W / H, 0.01, 20);
camera.position.set(0.08, 0.46, 0.52);
const look = new THREE.Vector3(-0.015, 0, -0.005);
camera.lookAt(look);
const focus = camera.position.distanceTo(new THREE.Vector3(0.05, 0.02, -0.02));
const { composer, bokehPass } = makeComposer(renderer, scene, camera, { focus, aperture: 0.02, maxblur: 0.01 });

window.params = { camera, look, bokehPass, scene, renderer, composer, THREE };
window.render = () => composer.render();
window.save = () => saveAll(renderer.domElement, 'tool-offerte');
composer.render();
window.__done = true;
</script>
</body>
</html>
