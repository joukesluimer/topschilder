<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · huiscalculator</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as C from './a-common.js';
import { buildSite } from './a-site.js';
const { THREE } = C;
C.pageStyle();

// Huiscalculator: jaren-30 twee-onder-een-kap met maatlijnen bij kozijn, boeidelen en voordeur.
const { renderer, scene, camera } = C.setup({ sunDir: [-0.7, 0.62, 0.36], sun: 4.3, hemi: 0.55, shadowSize: 22 });

const brick = C.brickMaterial({ hue: 9, sat: 42, light: 33, varL: 8, mortar: '#b9b3a7', seed: 4 });
const cream = '#ece2cb';
const block = C.buildBlock({
  units: [
    { width: 6.2, door: 'L', frame: cream, doorColor: cream, brick },
    { width: 6.2, door: 'R', frame: cream, doorColor: cream, brick },
  ],
  roofMat: C.roofMaterial({ hue: 15, sat: 58, light: 41, seed: 7 }),
  fasciaHex: cream,
});
scene.add(block);
buildSite(scene, block.userData, {
  hedgeH: 0.55,
  shrubs: [[-7.1, 1.0, 0.85], [7.1, 1.0, 0.8], [-6.05, 0.9, 0.38], [6.05, 0.9, 0.38], [0, 0.9, 0.5]],
});

// maatlijnen
const a = block.userData;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const u0 = a.units[0];
const m = u0.main;
scene.add(C.dimension(V(m.x - m.w / 2, m.y - 0.32, 0.12), V(m.x + m.w / 2, m.y - 0.32, 0.12), '250 cm', V(0, 1, 0), V(0, -0.27, 0.05)));
const d = u0.door;
scene.add(C.dimension(V(d.x + d.w / 2 + 0.22, d.y, 0.12), V(d.x + d.w / 2 + 0.22, d.y + d.h, 0.12), '255 cm', V(1, 0, 0), V(0.62, 0, 0.05)));
const fy = a.eaveH - 0.28;
scene.add(C.dimension(V(a.xL - 0.04, fy, a.zf + 0.2), V(a.xR + 0.04, fy, a.zf + 0.2), '13,4 m', V(0, 1, 0), V(-2.4, 0, 0)));

C.archCamera(camera, [-17.5, 2.3, 22], [0.9, 0, -3.2], 0.225);
camera.fov = 27.5; camera.updateProjectionMatrix();
renderer.render(scene, camera);
C.installExport(renderer, 'tool-calculator');
window.ready = true;
</script>
</body>
</html>
